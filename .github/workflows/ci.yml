name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile
        run: python -m py_compile main.py transcriber.py utils.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
